name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yaml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yaml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to GHCR (main only)
        type: boolean
        default: false
      package_ref:
        description: pak reference for glysmith (default is the r-universe release)
        type: string
        default: glysmith

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/glycoverse/glysmith

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: github.event_name != 'release' || !github.event.release.prerelease
    outputs:
      package-ref: ${{ steps.config.outputs.package-ref }}
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - name: Select the package source and publishing mode
        id: config
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_REF: ${{ inputs.package_ref || 'glysmith' }}
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            PACKAGE_REF="glycoverse/glysmith@$RELEASE_TAG"
          fi
          echo "package-ref=$PACKAGE_REF" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: '.'
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: GLYSMITH_REF=${{ needs.prepare.outputs.package-ref }}
          cache-from: type=gha,scope=glysmith-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=glysmith-${{ matrix.arch }}
          # Refresh package repository metadata on every build.
          no-cache-filters: glysmith
      - name: Test the runtime without network access
        run: |
          docker run --rm --network none \
            "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}" \
            Rscript /opt/glysmith/smoke-test.R
      - name: Collect the installed versions
        run: |
          mkdir -p build
          for file in version.txt package-versions.tsv build-session.txt; do
            docker run --rm --network none \
              "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}" \
              cat "/opt/glysmith/$file" > "build/$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: build/
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested architecture
        if: needs.prepare.outputs.publish == 'true'
        run: docker push "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"

  publish:
    name: Publish multi-platform tags
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only after both platforms pass with the same glysmith version
        run: |
          cmp build/packages-amd64/version.txt build/packages-arm64/version.txt
          version=$(cat build/packages-amd64/version.txt)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:r4.6.2" \
            --tag "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64" \
            "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"

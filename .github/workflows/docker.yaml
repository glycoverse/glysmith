name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yaml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yaml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to GHCR (main only)
        type: boolean
        default: false
      package_ref:
        description: pak reference for glysmith (default is the r-universe release)
        type: string
        default: glysmith

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/glycoverse/glysmith
  HUB_IMAGE: docker.io/fubin1999/glysmith

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      package-ref: ${{ steps.config.outputs.package-ref }}
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - name: Select the package source and publishing mode
        id: config
        env:
          PACKAGE_REF: ${{ inputs.package_ref || 'glysmith' }}
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ] || [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            PACKAGE_REF="$GITHUB_REPOSITORY@$GITHUB_SHA"
          fi
          echo "package-ref=$PACKAGE_REF" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: '.'
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.BUILD_TAG }}
          build-args: GLYSMITH_REF=${{ needs.prepare.outputs.package-ref }}
          cache-from: type=gha,scope=glysmith-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=glysmith-${{ matrix.arch }}
          # Re-run the package installer even if the Dockerfile is unchanged.
          no-cache-filters: glysmith
      - name: Test the runtime without network access
        run: |
          docker run --rm --network none \
            "$IMAGE:$BUILD_TAG" \
            Rscript /opt/glysmith/smoke-test.R
      - name: Collect the installed versions and check the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p build
          for file in version.txt package-versions.tsv build-session.txt; do
            docker run --rm --network none \
              "$IMAGE:$BUILD_TAG" \
              cat "/opt/glysmith/$file" > "build/$file"
          done
          version=$(cat build/version.txt)
          if [[ -n "$RELEASE_TAG" && "$version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Release $RELEASE_TAG contains glysmith $version."
            exit 1
          fi
          echo "$IMAGE:$BUILD_TAG" > build/image-ref.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: build/
          overwrite: true
      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested architecture
        if: needs.prepare.outputs.publish == 'true'
        run: docker push "$IMAGE:$BUILD_TAG"

  publish:
    name: Publish multi-platform tags
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: docker-publish-tags
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only after both platforms pass with the same glysmith version
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          cmp build/packages-amd64/version.txt build/packages-arm64/version.txt
          version=$(cat build/packages-amd64/version.txt)
          [[ "$version" =~ ^[0-9]+([.-][0-9]+)+$ ]]
          tags=("$version" "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          latest=$(gh repo view "$GITHUB_REPOSITORY" --json latestRelease --jq '.latestRelease.tagName // ""')
          if [[ "$PRERELEASE" != true && "$version" == "${latest#v}" ]]; then
            tags+=(latest r4.6.2)
          fi
          printf '%s\n' "${tags[@]}" > tags.txt
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$IMAGE:$tag")
          done
          docker buildx imagetools create \
            "${args[@]}" --metadata-file index.json \
            "$(cat build/packages-amd64/image-ref.txt)" \
            "$(cat build/packages-arm64/image-ref.txt)"
          docker buildx imagetools inspect "$IMAGE:$version"
      - name: Log in to Docker Hub for the release
        if: github.event_name == 'release'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: fubin1999
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the tested release to Docker Hub
        if: github.event_name == 'release'
        run: |
          digest=$(jq -er '.["containerimage.descriptor"].digest' index.json)
          while read -r tag; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              "docker://$IMAGE@$digest" "docker://$HUB_IMAGE:$tag"
          done < tags.txt
